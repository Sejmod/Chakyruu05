<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мугалимге миң таазим</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Библиотека конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
</head>
<body>
    <!-- Интерактивный фон частиц -->
    <canvas id="bg-canvas"></canvas>

    <div id="loader">
        <button class="btn-start" id="start-btn">Майрамды баштоо (Начать)</button>
    </div>

    <div class="invitation-card" id="card">
        <h1 class="crypt-text" data-text="МУГАЛИМГЕ МИҢ ТААЗИМ!"></h1>
        <h2 class="crypt-text" data-text="Кесиптик майрамыңыздар менен!"></h2>
        
        <p class="message crypt-text" data-text="Урматтуу биздин ардактуу агай-эжейлер! Сиздерди Мугалимдер күнүнө арналган майрамдык кечебизге чакырабыз! Сиздердин мээнетиңиздер үчүн терең ыраазычылык билдиребиз!"></p>
        
        <div class="details">
            <div class="detail-item crypt-text" data-text="Күнү: 5-Октябрь"></div>
            <div class="detail-item crypt-text" data-text="Убактысы: 15:00"></div>
            <div class="detail-item crypt-text" data-text="Орду: Акт залы"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
